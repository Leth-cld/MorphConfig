name: Build Morph

on:
  push:
    branches: [ ai-fixes ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon
